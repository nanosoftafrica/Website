# ════════════════════════════════════════════════════════════════
# Nanosoft Technology — GitHub Actions CI/CD
# Deploys automatically to your VPS via SSH on push to main.
#
# REQUIRED SECRETS (add in GitHub → Settings → Secrets):
#   VPS_HOST      — your server IP or hostname (e.g. 41.89.x.x)
#   VPS_USER      — SSH user (e.g. root or ubuntu)
#   VPS_SSH_KEY   — contents of your private key (~/.ssh/id_rsa)
#   VPS_APP_PATH  — absolute path on VPS (e.g. /opt/nanosoft)
# ════════════════════════════════════════════════════════════════
name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Checkout code ────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Basic smoke test (Node syntax check) ─────────────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps & syntax check
        run: |
          npm ci --omit=dev
          node -e "require('./server/app.js')" &
          sleep 3
          kill %1 2>/dev/null || true
          echo "Syntax OK"

      # ── 3. Deploy via SSH ────────────────────────────────────
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:        ${{ secrets.VPS_HOST }}
          username:    ${{ secrets.VPS_USER }}
          key:         ${{ secrets.VPS_SSH_KEY }}
          timeout:     10m
          script: |
            set -e
            cd ${{ secrets.VPS_APP_PATH }}

            echo "⏬ Pulling latest code…"
            git pull origin main

            echo "🔨 Building Docker image…"
            docker compose build --no-cache

            echo "🚀 Restarting container (zero-downtime swap)…"
            docker compose up -d --remove-orphans

            echo "⏳ Waiting for health check…"
            sleep 8
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' nanosoft_app 2>/dev/null || echo "no-healthcheck")
            echo "Container status: $STATUS"

            echo "🧹 Pruning unused images…"
            docker image prune -f

            echo "✅ Deploy complete."

      # ── 4. Notify on failure ─────────────────────────────────
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deploy failed. Check the Actions log above."
          # Optionally wire up Slack/email here:
          # curl -X POST -H 'Content-type: application/json' \
          #   --data '{"text":"🚨 Nanosoft deploy failed on main"}' \
          #   ${{ secrets.SLACK_WEBHOOK_URL }}
