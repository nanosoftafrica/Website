<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Blog & News — Nanosoft Technology</title>
  <meta name="description" content="Latest news, insights and updates from Nanosoft Technology — IT solutions for Africa."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/assets/theme.css"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
    h1,h2,h3,h4{font-family:'Sora',sans-serif}
    ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--faint);border-radius:99px}
    nav{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:16px 52px;background:rgba(255,255,255,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
    .nav-logo{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--text)}
    .logo-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--blue-l));display:grid;place-items:center;font-family:'Sora',sans-serif;font-size:15px;font-weight:800;color:#fff}
    .logo-text span:first-child{display:block;font-family:'Sora',sans-serif;font-size:16px;font-weight:800}
    .logo-text span:last-child{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px}
    .nav-back{font-size:13.5px;font-weight:600;color:var(--text-2);text-decoration:none;display:flex;align-items:center;gap:6px;padding:9px 18px;border-radius:999px;transition:background .2s,color .2s}
    .nav-back:hover{background:var(--blue-pale);color:var(--blue-d)}
    main{padding:140px 24px 80px;max-width:1100px;margin:0 auto}
    .page-header{margin-bottom:56px;text-align:center;position:relative}
    .sec-tag{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--blue);margin-bottom:14px}
    .sec-tag::before{content:'';display:inline-block;width:20px;height:2px;background:var(--blue);border-radius:2px}
    h1{font-size:clamp(32px,5vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1.1;margin-bottom:16px;color:var(--text)}
    .page-sub{font-size:17px;color:var(--muted);max-width:540px;margin:0 auto}
    .posts-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
    .post-card{background:#fff;border:1px solid var(--border);border-radius:18px;overflow:hidden;transition:all 0.3s;color:var(--text);display:flex;flex-direction:column;box-shadow:var(--shadow-sm)}
    .post-card:hover{border-color:var(--blue);transform:translateY(-4px);box-shadow:var(--shadow)}
    .post-cover{width:100%;height:180px;object-fit:cover;background:linear-gradient(135deg,var(--blue-pale),var(--border));display:flex;align-items:center;justify-content:center;font-size:40px;color:var(--faint)}
    .post-cover img{width:100%;height:100%;object-fit:cover}
    .post-body{padding:24px;flex:1;display:flex;flex-direction:column}
    .post-meta{display:flex;gap:12px;align-items:center;margin-bottom:12px}
    .post-date{font-size:11px;color:var(--faint)}
    .post-author{font-size:11px;color:var(--muted);font-weight:500}
    .post-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
    .post-tag{padding:2px 8px;border-radius:4px;background:var(--blue-pale);color:var(--blue-d);font-size:10px;font-weight:700;letter-spacing:0.5px;text-decoration:none;transition:background 0.2s}
    .post-tag:hover{background:#D6EEFA}
    .post-card-link{text-decoration:none;color:inherit;display:flex;flex-direction:column;flex:1}
    .post-card h2{font-size:18px;font-weight:700;line-height:1.3;margin-bottom:10px}
    .post-excerpt{font-size:13px;color:var(--muted);line-height:1.65;flex:1}
    .post-read{margin-top:16px;font-size:13px;font-weight:600;color:var(--blue)}
    .empty{text-align:center;padding:80px 24px;color:var(--muted)}
    .empty h2{font-size:24px;margin-bottom:10px;color:var(--text)}
    .tag-filter-chip{display:inline-flex;align-items:center;gap:8px;margin:0 auto 32px;padding:8px 16px;border-radius:99px;background:var(--blue-pale);border:1px solid #BAE0F5;color:var(--blue-d);font-size:13px;font-weight:600;width:fit-content}
    .tag-filter-chip a{color:var(--muted);text-decoration:none;font-weight:700}
    .tag-filter-chip a:hover{color:var(--text)}
    footer{border-top:1px solid var(--border);padding:32px 24px;text-align:center;color:var(--faint);font-size:13px}
    footer a{color:var(--muted);text-decoration:none}
    footer a:hover{color:var(--text)}
    @media(max-width:900px){.posts-grid{grid-template-columns:repeat(2,1fr)}nav{padding:14px 20px}}
    @media(max-width:580px){.posts-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<nav>
  <a href="/" class="nav-logo">
    <div class="logo-mark">N</div>
    <div class="logo-text"><span>Nanosoft</span><span>Technology</span></div>
  </a>
  <a href="/" class="nav-back">← Back to site</a>
</nav>
<main>
  <div class="page-header">
    <div class="sec-tag">Blog &amp; News</div>
    <h1>Insights from Nanosoft</h1>
    <p class="page-sub">Updates, thought leadership and news from our team across Africa.</p>
    <div id="tag-filter-bar" style="display:flex;justify-content:center"></div>
    <svg class="connector-line" width="140" height="90" style="left:calc(50% + 300px);top:-10px" viewBox="0 0 140 90" aria-hidden="true">
      <path d="M5,5 C 60,5 110,30 130,80" marker-end="url(#arrowhead-blog)"/>
      <defs><marker id="arrowhead-blog" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="var(--blue-l)" opacity=".6"/></marker></defs>
    </svg>
  </div>
  <div class="posts-grid" id="posts-grid">
    <div class="empty" style="grid-column:span 3" id="loading">Loading posts…</div>
  </div>
</main>
<footer><p>© <span id="yr"></span> Nanosoft Technology Limited · <a href="/">ntlafrica.com</a></p></footer>
<script src="/assets/interactive.js" defer></script>
<script>
document.getElementById('yr').textContent = new Date().getFullYear();
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function fmtDate(d){if(!d)return'';return new Date(d).toLocaleDateString('en-KE',{year:'numeric',month:'short',day:'numeric'})}
async function loadPosts(){
  const activeTag = new URLSearchParams(window.location.search).get('tag');
  const tagBar = document.getElementById('tag-filter-bar');
  if (activeTag) {
    tagBar.innerHTML = '<div class="tag-filter-chip">Filtered by tag <a href="/blog.html">✕ clear</a></div>';
  }
  try{
    const url = '/api/blog' + (activeTag ? '?tag='+encodeURIComponent(activeTag) : '');
    const res=await fetch(url);
    const posts=await res.json();
    const grid=document.getElementById('posts-grid');
    if(!posts.length){
      grid.innerHTML='<div class="empty" style="grid-column:span 3"><h2>No posts'+(activeTag?' with this tag':' yet')+'</h2><p>'+(activeTag?'Try browsing <a href="/blog.html" style="color:var(--blue)">all posts</a>.':'Check back soon for news and insights from Nanosoft Technology.')+'</p></div>';
      return;
    }
    grid.innerHTML=posts.map(p=>{
      const tags=(p.tags||[]).map(t=>'<a class="post-tag" href="/blog.html?tag='+esc(t.slug)+'">'+esc(t.name)+'</a>').join('');
      return '<div class="post-card">'+
        '<div class="post-cover">'+(p.coverImage?'<img src="'+esc(p.coverImage)+'" alt="'+esc(p.title)+'" loading="lazy"/>':'📰')+'</div>'+
        '<div class="post-body">'+
        '<div class="post-meta"><span class="post-date">'+fmtDate(p.publishedAt||p.createdAt)+'</span><span class="post-author">'+esc(p.author)+'</span></div>'+
        (tags?'<div class="post-tags">'+tags+'</div>':'')+
        '<a href="/blog-post.html?slug='+esc(p.slug)+'" class="post-card-link">'+
        '<h2>'+esc(p.title)+'</h2>'+
        '<p class="post-excerpt">'+esc(p.excerpt)+'</p>'+
        '<span class="post-read">Read more →</span>'+
        '</a></div></div>';
    }).join('');
  }catch(e){
    document.getElementById('posts-grid').innerHTML='<div class="empty" style="grid-column:span 3"><h2>Could not load posts</h2></div>';
  }
}
loadPosts();
</script>
</body>
</html>
