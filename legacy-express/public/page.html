<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title id="page-title">Nanosoft Technology</title>
  <meta id="page-desc" name="description" content=""/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/assets/theme.css"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.7}
    h1,h2,h3,h4{font-family:'Sora',sans-serif}
    ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--faint);border-radius:99px}
    nav{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:16px 52px;background:rgba(255,255,255,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
    .nav-logo{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--text)}
    .logo-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--blue-l));display:grid;place-items:center;font-family:'Sora',sans-serif;font-size:15px;font-weight:800;color:#fff}
    .logo-text span:first-child{display:block;font-family:'Sora',sans-serif;font-size:16px;font-weight:800}
    .logo-text span:last-child{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px}
    .nav-back{font-size:13.5px;font-weight:600;color:var(--text-2);text-decoration:none;padding:9px 18px;border-radius:999px;transition:background .2s,color .2s}
    .nav-back:hover{background:var(--blue-pale);color:var(--blue-d)}
    main{padding:140px 24px 80px;max-width:820px;margin:0 auto}
    .not-found{text-align:center;padding:80px 24px;color:var(--muted)}
    footer{border-top:1px solid var(--border);padding:32px 24px;text-align:center;color:var(--faint);font-size:13px}
    footer a{color:var(--muted);text-decoration:none}

    /* ── Blocks ── */
    .block{margin-bottom:48px}
    .block:last-child{margin-bottom:0}

    .block-hero{text-align:center;padding:24px 0 48px}
    .block-hero img{width:100%;max-height:360px;object-fit:cover;border-radius:16px;margin-bottom:32px;background:var(--bg-2)}
    .block-hero h1{font-size:clamp(30px,5vw,48px);font-weight:800;letter-spacing:-1.5px;line-height:1.1;margin-bottom:16px;color:var(--text)}
    .block-hero .sub{font-size:17px;color:var(--muted);max-width:560px;margin:0 auto 28px}
    .block-hero .cta{display:inline-block;padding:13px 28px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--blue-d));color:#fff;font-size:15px;font-weight:700;text-decoration:none;transition:all 0.2s}
    .block-hero .cta:hover{box-shadow:0 6px 24px var(--blue-glow);transform:translateY(-2px)}

    .block-richtext{font-size:16px;line-height:1.8;color:var(--text-2)}
    .block-richtext h2{font-size:26px;font-weight:800;margin:32px 0 16px;color:var(--text)}
    .block-richtext h3{font-size:20px;font-weight:700;margin:28px 0 12px;color:var(--text)}
    .block-richtext p{margin-bottom:18px}
    .block-richtext ul,.block-richtext ol{margin:14px 0 18px 24px}
    .block-richtext li{margin-bottom:8px}
    .block-richtext a{color:var(--blue);text-decoration:underline}
    .block-richtext strong{color:var(--text);font-weight:700}
    .block-richtext img{max-width:100%;border-radius:12px;margin:16px 0}

    .block-image img{width:100%;border-radius:16px;background:var(--bg-2)}
    .block-image .caption{margin-top:12px;font-size:13px;color:var(--faint);text-align:center}

    .block-cta{background:var(--blue-pale);border-radius:28px;padding:48px;text-align:center}
    .block-cta h2{font-size:28px;font-weight:800;margin-bottom:12px;color:var(--text)}
    .block-cta p{font-size:15px;color:var(--muted);margin-bottom:24px;max-width:520px;margin-left:auto;margin-right:auto}
    .block-cta a{display:inline-block;padding:13px 28px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--blue-d));color:#fff;font-size:15px;font-weight:700;text-decoration:none;transition:all 0.2s}
    .block-cta a:hover{box-shadow:0 6px 24px var(--blue-glow);transform:translateY(-2px)}

    @media(max-width:600px){nav{padding:14px 20px}.block-cta{padding:32px 24px}}
  </style>
</head>
<body>
<nav>
  <a href="/" class="nav-logo"><div class="logo-mark">N</div><div class="logo-text"><span>Nanosoft</span><span>Technology</span></div></a>
  <a href="/" class="nav-back">← Back to site</a>
</nav>
<main id="main">
  <div style="text-align:center;padding:80px 24px;color:var(--muted)">Loading…</div>
</main>
<footer><p>© <span id="yr"></span> Nanosoft Technology Limited · <a href="/">ntlafrica.com</a></p></footer>
<script src="/assets/interactive.js" defer></script>
<script>
document.getElementById('yr').textContent=new Date().getFullYear();
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function renderBlock(b){
  if (b.type === 'hero') {
    return '<div class="block block-hero">'+
      (b.image?'<img src="'+esc(b.image)+'" alt="'+esc(b.heading)+'"/>':'')+
      '<h1>'+esc(b.heading)+'</h1>'+
      (b.subheading?'<p class="sub">'+esc(b.subheading)+'</p>':'')+
      (b.ctaText&&b.ctaHref?'<a class="cta" href="'+esc(b.ctaHref)+'">'+esc(b.ctaText)+'</a>':'')+
      '</div>';
  }
  if (b.type === 'richtext') {
    return '<div class="block block-richtext">'+(b.html||'')+'</div>';
  }
  if (b.type === 'image') {
    return '<div class="block block-image">'+
      '<img src="'+esc(b.url)+'" alt="'+esc(b.alt||'')+'"/>'+
      (b.caption?'<div class="caption">'+esc(b.caption)+'</div>':'')+
      '</div>';
  }
  if (b.type === 'cta') {
    return '<div class="block block-cta">'+
      '<h2>'+esc(b.heading)+'</h2>'+
      (b.text?'<p>'+esc(b.text)+'</p>':'')+
      (b.buttonText&&b.buttonHref?'<a href="'+esc(b.buttonHref)+'">'+esc(b.buttonText)+'</a>':'')+
      '</div>';
  }
  return '';
}

async function loadPage(){
  const slug=new URLSearchParams(window.location.search).get('slug');
  const main=document.getElementById('main');
  if(!slug){main.innerHTML='<div class="not-found"><h2>No page specified</h2><a href="/" style="color:var(--blue)">← Back to site</a></div>';return;}
  try{
    const res=await fetch('/api/pages/'+encodeURIComponent(slug));
    if(!res.ok)throw new Error('Not found');
    const p=await res.json();
    document.getElementById('page-title').textContent=(p.seoTitle||p.title)+' — Nanosoft Technology';
    document.getElementById('page-desc').setAttribute('content',p.seoDescription||'');
    main.innerHTML=(p.blocks||[]).map(renderBlock).join('');
  }catch(e){
    main.innerHTML='<div class="not-found"><h2>Page not found</h2><p>It may have been removed or the link is incorrect.</p><a href="/" style="color:var(--blue)">← Back to site</a></div>';
  }
}
loadPage();
</script>
</body>
</html>
