# ─────────────────────────────────────────────────────────────
# Nanosoft Technology — docker-compose.yml (PostgreSQL)
# ─────────────────────────────────────────────────────────────

services:

  # ── Node.js Application ──────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nanosoft_app
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:3000"
    environment:
      NODE_ENV:       ${NODE_ENV:-production}
      PORT:           3000
      DATABASE_URL:   ${DATABASE_URL:-postgresql://nanosoft:nanosoft@postgres:5432/nanosoft}
      DB_SSL:         ${DB_SSL:-false}
      JWT_SECRET:     ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      SITE_URL:       ${SITE_URL:-https://ntlafrica.com}
      SMTP_HOST:      ${SMTP_HOST:-}
      SMTP_PORT:      ${SMTP_PORT:-587}
      SMTP_USER:      ${SMTP_USER:-}
      SMTP_PASS:      ${SMTP_PASS:-}
      NOTIFY_EMAIL:   ${NOTIFY_EMAIL:-}
    volumes:
      - uploads_data:/app/public/uploads   # persists uploaded media across rebuilds
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nanosoft_net

  # ── PostgreSQL ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nanosoft_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       nanosoft
      POSTGRES_USER:     nanosoft
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nanosoft}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nanosoft_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nanosoft -d nanosoft"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Do NOT expose 5432 to host in production

networks:
  nanosoft_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
